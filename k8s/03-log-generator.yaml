apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: generator
          image: log-generator:v3
          imagePullPolicy: Never
          env:
            - name: KAFKA_BROKER
              value: "kafka.streaming.svc.cluster.local:9092"