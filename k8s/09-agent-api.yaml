apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-rolebinding
subjects:
  - kind: ServiceAccount
    name: agent-sa
    namespace: lakehouse
roleRef:
  kind: ClusterRole
  name: agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      serviceAccountName: agent-sa
      containers:
        - name: agent-api
          image: my-agent-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
            - name: SYSTEM_1_MODEL
              value: "gemini-flash-lite-latest"
            - name: SYSTEM_2_MODEL
              value: "gemini-flash-lite-latest"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api
  namespace: lakehouse
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: agent-api
