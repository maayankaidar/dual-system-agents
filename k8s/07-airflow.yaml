apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: my-airflow:latest
          imagePullPolicy: Never
          # 'airflow standalone' runs the database, scheduler, and webserver in one container!
          # Script ensures admin/admin user is created/reset deterministically on startup.
          command:
            - "bash"
            - "-c"
            - |
              airflow standalone &
              pid=$!
              echo "Waiting for Airflow DB initialization..."
              while ! airflow db check >/dev/null 2>&1; do
                sleep 2
              done
              echo "Ensuring deterministic admin/admin credentials..."
              airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com 2>/dev/null || airflow users reset-password -u admin -p admin
              wait $pid
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "False"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://agent:agentpassword@postgres.lakehouse.svc.cluster.local:5432/analytical_db"
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: lakehouse
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: airflow
